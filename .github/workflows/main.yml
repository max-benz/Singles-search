# .github/workflows/sync.yml
name: Sync GW Apps → Supabase

on:
  schedule:
    - cron: '0 2 * * *'      # every day at 02:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  extract-and-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies & run extraction
        working-directory: extraction
        run: |
          npm ci
          node extract_and_load.js
        env:
          GWAPPS_API_KEY:       ${{ secrets.GWAPPS_API_KEY }}
          GWAPPS_EMAIL:         ${{ secrets.GWAPPS_EMAIL }}
          GWAPPS_CUSTOMER_ID:   ${{ secrets.GWAPPS_CUSTOMER_ID }}
          GWAPPS_FORM_ID:       ${{ secrets.GWAPPS_FORM_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET }}
